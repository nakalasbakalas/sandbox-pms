name: Channel sync lite activation

on:
  push:
    branches:
      - ops/activate-channel-sync-lite-20260711

permissions:
  contents: read

concurrency:
  group: channel-sync-lite-production-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Verify OAuth, deploy, and activate review-only polling
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-d6ns31h4tr6s73c9i8g0
      TARGET_COMMIT: 1ec748f24861b4821d96205d70f4807fe4df85bf
      EXPECTED_MAILBOX: booking@sandboxhotel.com
      PUBLIC_HEALTH_URL: https://book.sandboxhotel.com/healthz?deep=1

    steps:
      - name: Check out exact merged lite commit
        uses: actions/checkout@v4
        with:
          ref: 1ec748f24861b4821d96205d70f4807fe4df85bf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Require Render API access
        shell: bash
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY is not configured as a GitHub Actions secret." >&2
            exit 1
          fi
          echo "Render API credential is available; value remains masked."

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify Render Gmail OAuth tuple exists
        run: npm run render:gmail-oauth:status -- --service-id "$RENDER_SERVICE_ID" --require-ready

      - name: Verify mailbox ownership and load masked runtime variables
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from 'node:fs'

          const serviceId = process.env.RENDER_SERVICE_ID
          const apiKey = process.env.RENDER_API_KEY
          const expectedMailbox = process.env.EXPECTED_MAILBOX.toLowerCase()
          const apiBase = 'https://api.render.com/v1'

          async function getEnvValue(key, required = true) {
            const response = await fetch(`${apiBase}/services/${encodeURIComponent(serviceId)}/env-vars/${encodeURIComponent(key)}`, {
              headers: { accept: 'application/json', authorization: `Bearer ${apiKey}` },
            })
            if (response.status === 404 && !required) return null
            const body = await response.json().catch(() => ({}))
            if (!response.ok) throw new Error(`Render env lookup failed for ${key}: HTTP ${response.status}`)
            const value = body?.value ?? body?.envVar?.value ?? body?.env_var?.value ?? body?.env?.value
            if (required && (value === undefined || value === null || String(value).length === 0)) {
              throw new Error(`Render env value is missing for ${key}.`)
            }
            return value === undefined || value === null ? null : String(value)
          }

          async function putEnvValue(key, value) {
            const response = await fetch(`${apiBase}/services/${encodeURIComponent(serviceId)}/env-vars/${encodeURIComponent(key)}`, {
              method: 'PUT',
              headers: {
                accept: 'application/json',
                authorization: `Bearer ${apiKey}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ value }),
            })
            if (!response.ok) throw new Error(`Render env update failed for ${key}: HTTP ${response.status}`)
          }

          const mailbox = (await getEnvValue('BOOKING_EMAIL_PRIMARY_MAILBOX')).toLowerCase()
          const clientId = await getEnvValue('BOOKING_EMAIL_GMAIL_CLIENT_ID')
          const clientSecret = await getEnvValue('BOOKING_EMAIL_GMAIL_CLIENT_SECRET')
          const refreshToken = await getEnvValue('BOOKING_EMAIL_GMAIL_REFRESH_TOKEN')
          const gmailUserId = await getEnvValue('BOOKING_EMAIL_GMAIL_USER_ID', false) || 'me'
          const databaseUrl = await getEnvValue('DATABASE_URL')

          if (mailbox !== expectedMailbox) {
            throw new Error(`Configured mailbox does not match expected mailbox ${expectedMailbox}.`)
          }

          const tokenResponse = await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'content-type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              client_id: clientId,
              client_secret: clientSecret,
              refresh_token: refreshToken,
              grant_type: 'refresh_token',
            }),
          })
          const tokenBody = await tokenResponse.json().catch(() => ({}))
          if (!tokenResponse.ok || !tokenBody.access_token) {
            throw new Error(`Gmail OAuth refresh failed: HTTP ${tokenResponse.status}`)
          }

          const profileResponse = await fetch(`https://gmail.googleapis.com/gmail/v1/users/${encodeURIComponent(gmailUserId)}/profile`, {
            headers: { authorization: `Bearer ${tokenBody.access_token}` },
          })
          const profile = await profileResponse.json().catch(() => ({}))
          if (!profileResponse.ok) throw new Error(`Gmail profile verification failed: HTTP ${profileResponse.status}`)
          const verifiedMailbox = String(profile.emailAddress || '').toLowerCase()
          if (verifiedMailbox !== expectedMailbox) {
            throw new Error(`OAuth profile belongs to ${verifiedMailbox || 'an unknown mailbox'}, not ${expectedMailbox}.`)
          }

          for (const value of [clientId, clientSecret, refreshToken, databaseUrl, tokenBody.access_token]) {
            console.log(`::add-mask::${value}`)
          }

          const exports = {
            DATABASE_URL: databaseUrl,
            BOOKING_EMAIL_PRIMARY_MAILBOX: mailbox,
            BOOKING_EMAIL_GMAIL_USER_ID: gmailUserId,
            BOOKING_EMAIL_GMAIL_CLIENT_ID: clientId,
            BOOKING_EMAIL_GMAIL_CLIENT_SECRET: clientSecret,
            BOOKING_EMAIL_GMAIL_REFRESH_TOKEN: refreshToken,
          }
          for (const [key, value] of Object.entries(exports)) {
            const delimiter = `__${key}_EOF__`
            appendFileSync(process.env.GITHUB_ENV, `${key}<<${delimiter}\n${value}\n${delimiter}\n`)
          }

          await putEnvValue('BOOKING_EMAIL_NEAR_LIVE_ENABLED', 'false')
          await putEnvValue('BOOKING_EMAIL_SYNC_INTERVAL_SECONDS', '120')
          await putEnvValue('BOOKING_EMAIL_SYNC_BATCH_LIMIT', '25')

          writeFileSync('oauth-mailbox-proof.json', JSON.stringify({
            generatedAt: new Date().toISOString(),
            serviceId,
            expectedMailbox,
            configuredMailbox: mailbox,
            oauthProfileMailbox: verifiedMailbox,
            oauthMode: 'refresh_token',
            oauthReady: true,
            mailboxOwnershipVerified: true,
            pollingSetTo: false,
            secretValues: 'omitted',
          }, null, 2))
          console.log(`Verified Gmail OAuth ownership for ${verifiedMailbox}; secret values omitted.`)
          NODE

      - name: Install Render CLI
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/cli/main/bin/install.sh | sh
          RENDER_BIN="$(command -v render || true)"
          if [ -z "$RENDER_BIN" ]; then
            RENDER_BIN="$(find "$HOME" -type f -name render -perm -111 2>/dev/null | head -n 1)"
          fi
          if [ -z "$RENDER_BIN" ]; then
            echo "Render CLI installation did not produce an executable." >&2
            exit 1
          fi
          echo "RENDER_BIN=$RENDER_BIN" >> "$GITHUB_ENV"
          "$RENDER_BIN" --version

      - name: Deploy exact main commit with polling disabled
        shell: bash
        run: |
          "$RENDER_BIN" deploys create "$RENDER_SERVICE_ID" \
            --commit "$TARGET_COMMIT" \
            --wait --confirm --output json > deploy-polling-disabled.json
          echo "Polling-disabled deploy completed."

      - name: Verify public health after disabled deploy
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 20 "$PUBLIC_HEALTH_URL" > health-disabled.json; then
              if node -e "const x=require('./health-disabled.json'); if(!x.ok) process.exit(1)"; then
                echo "Public deep health is green with polling disabled."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Public deep health did not become green after the disabled deploy." >&2
          exit 1

      - name: Capture pre-activation review-only proof
        shell: bash
        run: |
          npm run booking-email:proof > booking-proof-before.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const proof = JSON.parse(readFileSync('booking-proof-before.json', 'utf8'))
          console.log(JSON.stringify({
            credentialConfigured: proof.credential?.configured,
            enabledSources: (proof.sources || []).filter((source) => source.enabled).length,
            latestSyncAt: (proof.sources || []).map((source) => source.lastSyncAt).filter(Boolean).sort().at(-1) || null,
            totalEvents: proof.capture?.totalEvents,
            needsReview: proof.capture?.needsReview,
            processed: proof.capture?.processed,
            linkedEvents: proof.capture?.linkedEvents,
          }))
          NODE

      - name: Enable near-live review-only polling
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.render.com/v1/services/${encodeURIComponent(process.env.RENDER_SERVICE_ID)}/env-vars/BOOKING_EMAIL_NEAR_LIVE_ENABLED`, {
            method: 'PUT',
            headers: {
              accept: 'application/json',
              authorization: `Bearer ${process.env.RENDER_API_KEY}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({ value: 'true' }),
          })
          if (!response.ok) throw new Error(`Could not enable polling: HTTP ${response.status}`)
          console.log('Near-live polling flag enabled; OAuth and review-only guards remain enforced.')
          NODE

      - name: Redeploy exact main commit with polling enabled
        shell: bash
        run: |
          "$RENDER_BIN" deploys create "$RENDER_SERVICE_ID" \
            --commit "$TARGET_COMMIT" \
            --wait --confirm --output json > deploy-polling-enabled.json
          echo "Polling-enabled deploy completed."

      - name: Verify public health after enabled deploy
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 20 "$PUBLIC_HEALTH_URL" > health-enabled.json; then
              if node -e "const x=require('./health-enabled.json'); if(!x.ok) process.exit(1)"; then
                echo "Public deep health is green with polling enabled."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Public deep health did not become green after the enabled deploy." >&2
          exit 1

      - name: Allow one bounded polling interval
        run: sleep 155

      - name: Confirm review-only scheduler ingestion state
        shell: bash
        run: |
          npm run booking-email:proof > booking-proof-after.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const before = JSON.parse(readFileSync('booking-proof-before.json', 'utf8'))
          const after = JSON.parse(readFileSync('booking-proof-after.json', 'utf8'))

          const latest = (proof) => (proof.sources || [])
            .filter((source) => source.enabled && source.lastSyncAt)
            .map((source) => new Date(source.lastSyncAt).getTime())
            .filter(Number.isFinite)
            .sort((a, b) => b - a)[0] || 0

          const beforeSync = latest(before)
          const afterSync = latest(after)
          if (!after.credential?.configured) throw new Error('Gmail credential status is not configured after activation.')
          if (afterSync <= beforeSync) throw new Error('Enabled booking-email source lastSyncAt did not advance after activation.')
          if (after.capture.processed !== before.capture.processed) {
            throw new Error('Processed event count changed during review-only polling.')
          }
          if (after.capture.linkedEvents !== before.capture.linkedEvents) {
            throw new Error('Linked operational event count changed during review-only polling.')
          }

          const totalDelta = after.capture.totalEvents - before.capture.totalEvents
          const needsReviewDelta = after.capture.needsReview - before.capture.needsReview
          if (totalDelta > 0 && needsReviewDelta !== totalDelta) {
            throw new Error('Newly captured events were not all retained in Needs Review.')
          }

          const summary = {
            generatedAt: new Date().toISOString(),
            targetCommit: process.env.TARGET_COMMIT,
            mailbox: process.env.EXPECTED_MAILBOX,
            pollingEnabled: true,
            pollingIntervalSeconds: 120,
            lastSyncAdvanced: true,
            beforeLastSyncAt: beforeSync ? new Date(beforeSync).toISOString() : null,
            afterLastSyncAt: new Date(afterSync).toISOString(),
            totalEventsBefore: before.capture.totalEvents,
            totalEventsAfter: after.capture.totalEvents,
            newReviewEvents: totalDelta,
            processedCountUnchanged: true,
            linkedEventCountUnchanged: true,
            operationalMutationsObserved: false,
            secretValues: 'omitted',
          }
          writeFileSync('channel-sync-activation-summary.json', JSON.stringify(summary, null, 2))
          console.log(JSON.stringify(summary))
          NODE

      - name: Publish sanitized activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: channel-sync-lite-activation-evidence
          path: |
            oauth-mailbox-proof.json
            booking-proof-before.json
            booking-proof-after.json
            channel-sync-activation-summary.json
            health-disabled.json
            health-enabled.json
          if-no-files-found: error
          retention-days: 14
