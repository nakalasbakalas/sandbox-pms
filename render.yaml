services:
  - type: web
    # Canonical custom-domain production service. Historical similarly named
    # services are not deployment targets for this Blueprint.
    name: sandbox-hotel-pms-v43m
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    # Production deploys apply reviewed migrations only. Initial property/user
    # data is handled through explicit onboarding or an owner-reviewed import.
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_PMS_API_MODE
        value: server
      - key: MONEY_READ_AUTHORITY
        value: legacy_float
      - key: ACCOUNTING_V2_ENABLED
        value: false
      - key: DIRECT_BOOKING_ENABLED
        value: false
      - key: OTA_LIVE_WRITES_ENABLED
        value: false
      - key: SSE_ENABLED
        value: true
      - key: APP_URL
        value: https://book.sandboxhotel.com
      - key: ALLOWED_ORIGINS
        value: https://book.sandboxhotel.com,https://staff.sandboxhotel.com,https://sandbox-hotel-pms-v43m.onrender.com
      - key: ALLOW_PUBLIC_SETUP
        value: false
      - key: BOOKING_EMAIL_PRIMARY_MAILBOX
        value: booking@sandboxhotel.com
      - key: BOOKING_EMAIL_NEAR_LIVE_ENABLED
        value: false
      - key: BOOKING_EMAIL_SYNC_INTERVAL_SECONDS
        value: 120
      - key: BOOKING_EMAIL_SYNC_BATCH_LIMIT
        value: 25
      - key: CHANNEL_MANAGER_PROVIDER
        value: channex
      - key: BOOKING_EMAIL_GMAIL_USER_ID
        sync: false
      - key: BOOKING_EMAIL_GMAIL_CLIENT_ID
        sync: false
      - key: BOOKING_EMAIL_GMAIL_CLIENT_SECRET
        sync: false
      - key: BOOKING_EMAIL_GMAIL_REFRESH_TOKEN
        sync: false
      - key: INITIAL_SETUP_TOKEN
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: sandbox-hotel-pms-db-v43m
          property: connectionString
      - key: SEED_MODE
        value: prod-safe
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_USERS_JSON
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD_HASH
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_USER_PASSWORD_HASH
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: DIRECT_BOOKING_TOKEN_SECRET
        sync: false
      - key: OTA_DRY_RUN
        value: true
      - key: OTA_WORKER_BASE_URL
        value: https://sandbox-hotel-pms-ota-worker-staging.onrender.com/api/internal/ops/worker/tasks
      - key: OTA_WORKER_SHARED_SECRET
        sync: false
      - key: BOOKING_COM_USERNAME
        sync: false
      - key: BOOKING_COM_PASSWORD
        sync: false

databases:
  - name: sandbox-hotel-pms-db-v43m
    databaseName: sandbox_hotel_pms
    plan: basic-256mb
