services:
  - type: web
    name: sandbox-hotel-pms
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    preDeployCommand: npm run db:migrate && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_PMS_API_MODE
        value: server
      - key: APP_URL
        value: https://book.sandboxhotel.com
      - key: ALLOWED_ORIGINS
        value: https://book.sandboxhotel.com,https://staff.sandboxhotel.com,https://sandbox-hotel-pms.onrender.com
      - key: ALLOW_PUBLIC_SETUP
        value: false
      - key: BOOKING_EMAIL_PRIMARY_MAILBOX
        value: booking@sandboxhotel.com
      - key: BOOKING_EMAIL_GMAIL_USER_ID
        sync: false
      - key: BOOKING_EMAIL_GMAIL_CLIENT_ID
        sync: false
      - key: BOOKING_EMAIL_GMAIL_CLIENT_SECRET
        sync: false
      - key: BOOKING_EMAIL_GMAIL_REFRESH_TOKEN
        sync: false
      - key: INITIAL_SETUP_TOKEN
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: sandbox-hotel-pms-db-v43m
          property: connectionString
      - key: SEED_MODE
        value: prod-safe
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_USERS_JSON
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD_HASH
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_USER_PASSWORD_HASH
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false

databases:
  - name: sandbox-hotel-pms-db-v43m
    databaseName: sandbox_hotel_pms
    plan: basic-256mb
